name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.state.outputs.exists }}
      build_type: ${{ steps.state.outputs.build_type }}
    steps:
      - name: Check Pages site
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/pages" > pages.json
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "build_type=none" >> "$GITHUB_OUTPUT"
            echo "::error title=Enable GitHub Pages::Pages is not turned on. Open https://github.com/${{ github.repository }}/settings/pages and choose either Deploy from a branch (main, folder /docs) or GitHub Actions. Then re-run this workflow."
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "build_type=$(jq -r '.build_type // "legacy"' pages.json)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
